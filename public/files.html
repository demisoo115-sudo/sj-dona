<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SJ DONA 파일관리</title><style>body{margin:0;background:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#0f172a}.app{max-width:850px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:15px;margin-top:12px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.blue{background:#2563eb;color:#fff}.dark{background:#0f172a;color:#fff}.light{background:#eef2f7}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:12px;padding:11px;font:inherit}textarea{min-height:80px}.file{padding:12px 0;border-bottom:1px solid #e2e8f0}.small{font-size:12px;color:#64748b}.answer{white-space:pre-wrap;line-height:1.6;background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px;min-height:70px}</style></head><body><div class="app"><div class="top"><div><h2 style="margin:0">📁 SJ DONA 파일관리</h2><div class="small">사진 · PDF · Word · Excel · CSV 등</div></div><button class="btn light" onclick="location.href='/'">← 홈</button></div><div class="card"><b>파일 업로드</b><input id="f" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" style="margin-top:10px"><div class="row" style="margin-top:8px"><button class="btn blue" onclick="upload()">업로드</button><button class="btn light" onclick="loadFiles()">새로고침</button></div><div id="msg" class="small" style="margin-top:8px"></div></div><div class="card"><b>내 파일</b><div id="list"></div></div><div class="card"><b>DONA 파일 분석</b><div id="selected" class="small">파일을 선택하세요.</div><textarea id="instruction" placeholder="예: 이 PDF를 요약해줘 / 이 인보이스의 금액과 날짜를 정리해줘 / 이 사진 내용을 설명해줘"></textarea><button class="btn dark" onclick="analyze()">DONA 분석</button><div id="answer" class="answer">분석할 파일을 선택하세요.</div></div></div><script>let current=null;const $=x=>document.getElementById(x);async function loadFiles(){const r=await fetch('/api/files'),j=await r.json();$('list').innerHTML=(j.files||[]).map(x=>`<div class="file"><b>${esc(x.name)}</b><div class="small">${Math.round(x.size/1024)} KB · ${new Date(x.modified).toLocaleString()}</div><div class="row" style="margin-top:7px"><button class="btn light" onclick='selectFile(${JSON.stringify(JSON.stringify(x))})'>선택/분석</button><button class="btn light" onclick="location.href='/api/files/${encodeURIComponent(x.id)}'">다운로드</button><button class="btn light" onclick='delFile(${JSON.stringify(x.id)})'>삭제</button></div></div>`).join('')||'<div class="small" style="padding:12px 0">업로드된 파일이 없습니다.</div>'}async function upload(){const f=$('f').files[0];if(!f)return alert('파일을 선택하세요.');const fd=new FormData();fd.append('file',f);$('msg').textContent='업로드 중…';const r=await fetch('/api/files',{method:'POST',body:fd}),j=await r.json();if(!r.ok)return $('msg').textContent=j.error||'업로드 실패';$('msg').textContent='업로드 완료: '+j.name;$('f').value='';loadFiles()}function selectFile(s){current=JSON.parse(s);$('selected').textContent='선택: '+current.name;$('answer').textContent='분석 지시를 입력하고 DONA 분석을 누르세요.'}async function analyze(){if(!current)return alert('먼저 파일을 선택하세요.');$('answer').textContent='DONA가 파일을 분석 중입니다…';const r=await fetch('/api/files/'+encodeURIComponent(current.id)+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction:$('instruction').value})}),j=await r.json();$('answer').textContent=r.ok?(j.text||'결과 없음'):(j.error||'분석 실패')}async function delFile(id){if(!confirm('이 파일을 삭제할까요?'))return;await fetch('/api/files/'+encodeURIComponent(id),{method:'DELETE'});if(current?.id===id)current=null;loadFiles()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}loadFiles();</script></body></html>
